<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121323">
    <meta name="description" content="두 손 사이에서 작은 불씨를 깨우고, 따뜻해진 풍등에 새해의 소원을 담아 밤하늘로 놓아주세요.">
    <title>풍등 체험 · 소원을 담은 밤</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css?v=warmth-1">
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body data-active="false" data-phase="gathering">
    <canvas id="scene" role="img" aria-label="두 손 사이에서 불씨를 만들고 풍등을 밝혀 밤하늘로 날리는 체험"></canvas>
    <canvas id="hand-light" aria-hidden="true"></canvas>

    <header class="masthead">
      <a class="wordmark" href="./" aria-label="소원을 담은 밤, 처음 화면">
        <svg viewBox="0 0 24 30" fill="none" aria-hidden="true">
          <path d="M6 5c3-2 9-2 12 0l2 10-5 10H9L4 15 6 5Z" />
          <path d="M9 25h6M9 5l1 18M15 5l-1 18M7 2h10" />
          <path class="mark-flame" d="M12 16c-3 3-2 5 0 5s3-2 0-5Z" />
        </svg>
        <span>소원을 담은 밤</span>
      </a>
      <div class="masthead-actions">
        <button id="sound-toggle" class="quiet-button" type="button" aria-pressed="true" title="음악과 효과음 끄기" hidden>소리 켜짐</button>
        <button id="stop-camera" class="quiet-button" type="button" hidden>카메라 끄기</button>
        <button id="restart" class="quiet-button" type="button" title="R 키를 누르면 첫 화면을 다시 불러옵니다" hidden>처음부터 다시</button>
      </div>
    </header>

    <main id="intro" class="introduction">
      <div class="intro-content">
        <h1><img src="./artwork/poongdeung-lettering-v1.png" width="1254" height="1254" alt="풍등 체험"></h1>
        <p class="intro-tagline">마음에 품은 빛, 하늘에 닿기를.</p>
        <p class="description">두 손으로 온기를 모아, 소원을 띄워보세요.</p>
        <div class="controls" aria-label="체험 시작 방법">
          <button id="camera-start" class="primary-button" type="button" aria-describedby="privacy-note">손으로 시작하기 <span aria-hidden="true">↗</span></button>
          <button id="mouse-start" class="text-button" type="button">마우스로 체험하기</button>
        </div>
      </div>
      <footer class="intro-notes">
        <p id="privacy-note">카메라는 손동작만 인식해요. 영상은 저장하거나 전송하지 않아요.</p>
        <p><span aria-hidden="true">♫</span> 잔잔한 음악과 함께해요.</p>
      </footer>
    </main>

    <section id="instruction" class="instruction" aria-live="polite" aria-atomic="true" aria-label="현재 할 동작">
      <p class="eyebrow">당신의 소원이 하늘에 닿는 시간</p>
      <img id="gathering-heading" src="./artwork/gathering-heading.png" width="1942" height="809" alt="" aria-hidden="true">
      <h2 id="instruction-title">손끝에 온기를 모아요</h2>
      <p id="instruction-detail">빛을 감싸듯 천천히 굴리거나, 두 손을 모아 3초간 머물러 주세요.</p>
      <progress id="lift-progress" max="1" value="0" aria-label="풍등을 들어 올린 높이" hidden></progress>
    </section>

    <div id="gather-zone" data-engaged="false" hidden>
      <p id="gather-status" role="status" aria-live="polite">빛이 머무는 곳에 두 손을 가까이 해주세요</p>
      <progress id="gather-progress" class="visually-hidden" max="1" value="0" aria-label="두 손으로 모은 온기"></progress>
    </div>

    <div class="active-controls">
      <p id="input-note" hidden>마우스 체험 · 화면의 두 손을 함께 움직여요</p>
      <p id="tracking-status" role="status" aria-live="polite"></p>
      <button id="mouse-action" class="primary-button" type="button" hidden>테두리 잡기</button>
    </div>

    <p id="status" role="status">밤하늘을 준비하고 있어요.</p>

    <noscript>풍등을 보려면 브라우저의 JavaScript를 켜 주세요.</noscript>
    <script>
      // Keep the recovery shortcut independent of the experience modules.
      window.addEventListener('keydown', (event) => {
        if (event.code !== 'KeyR' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
        event.preventDefault();
        window.location.reload();
      });
    </script>
    <script type="module" src="./script.js?v=approach-2"></script>
  </body>
</html>
